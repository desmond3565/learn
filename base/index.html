<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h2 {
        font-family: "微软雅黑";
        color: red;
      }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>标题1（最大，一个页面建议只用1个）</h1>
    <h2>标题2</h2>
    <h3>标题3</h3>
    <h4>标题4</h4>
    <h5>标题5</h5>
    <h6>标题6（最小标题）</h6>

    <form>
      <!-- 文本输入框 -->
      <input type="text" placeholder="请输入文字" />
      <br />
      <!-- 数字输入框 -->
      <input type="number" placeholder="输入数字" />
      <br />
      <!-- 按钮 -->
      <button>提交按钮</button>
    </form>

    <!-- 无序列表（圆点） -->
    <ul>
      <li>项目A</li>
      <li>项目B</li>
    </ul>

    <!-- 有序列表（数字编号） -->
    <ol>
      <li>第一步</li>
      <li>第二步</li>
    </ol>

    <div>块容器，独占一行，用来划分区域</div>
    <div class="box">内容</div>
    <div class="item">其他</div>
    <span>行内容器，不换行，包裹一小段文字</span>

    <br />
    <!-- a 超链接 href=目标地址 -->
    <a href="https://www.baidu.com">点我跳转百度</a>
    <br />
    <!-- target="_blank" 在新标签打开 -->
    <a href="https://www.baidu.com" target="_blank">新窗口打开百度</a>
    <hr />
    <!-- img 图片，单标签；src图片地址，alt图片加载失败时的文字 -->
    <img src="bluebgw.jpg" alt="图片描述" />

    <p>段落标签，自动换行，段落之间有空距</p>
    <p>段落标签，自动换行，段落之间有空距</p>
    <br />
    <!-- 强制换行，单标签，不需要闭合 -->
    <hr />
    <!-- 分割横线 -->

    <b>加粗</b>
    <i>斜体</i>
    <u>下划线</u>
    <s>删除线</s>
    <script>
      console.log("hello world");
    </script>
    <script src="main.js"></script>
  </body>
</html>
