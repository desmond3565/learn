<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex演示</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /* 父容器 */
      .box-wrap {
        display: flex;
        gap: 10px; /* 项目之间间距，现代flex新增，不用margin */
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
        flex-wrap: wrap; /* 空间不够自动换行 */
        background: #eee;
        padding: 20px;
      }
      /* 子项目 */
      .item {
        width: 100px;
        height: 100px;
        background: #4299e1;
        color: white;
        text-align: center;
        line-height: 100px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="box-wrap">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
    </div>
  </body>
</html>
